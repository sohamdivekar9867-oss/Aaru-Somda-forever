<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Chat Memories · Aaru & Somo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phone-gallery.css">
</head>
<body>
  <main class="phone-page">
    <a class="phone-back" href="bedroom.html">← Back to bedroom</a>

    <header class="phone-header">
      <div class="phone-eyebrow">OUR LITTLE PHONE</div>
      <h1>Chat <em>Memories</em></h1>
      <p>Little screenshots and moments from the conversations we never want to lose. ❤️</p>
    </header>

    <section class="profile-switcher" aria-label="Choose whose gallery to view">
      <button class="profile-tab is-active" type="button" data-profile="Aaru">Aaru</button>
      <button class="profile-tab" type="button" data-profile="Somo">Somo</button>
    </section>

    <section class="gallery-toolbar">
      <div>
        <div class="gallery-title" id="galleryTitle">Aaru's screenshots</div>
        <div class="gallery-note" id="galleryNote">Photos saved here belong to Aaru's collection.</div>
      </div>
      <label class="upload-button" id="uploadLabel">
        ＋ Add photos
        <input id="photoInput" type="file" accept="image/*" multiple>
      </label>
    </section>

    <div class="upload-status" id="uploadStatus" aria-live="polite"></div>
    <section class="photo-grid" id="photoGrid" aria-live="polite"></section>
  </main>

  <div class="photo-viewer" id="photoViewer" aria-hidden="true">
    <div class="viewer-backdrop" id="viewerBackdrop"></div>
    <button class="viewer-close" id="viewerClose" type="button" aria-label="Close">×</button>
    <button class="viewer-nav viewer-prev" id="viewerPrev" type="button" aria-label="Previous photo">‹</button>
    <figure class="viewer-figure">
      <img id="viewerImage" src="" alt="Chat memory">
      <figcaption id="viewerCaption"></figcaption>
    </figure>
    <button class="viewer-nav viewer-next" id="viewerNext" type="button" aria-label="Next photo">›</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="protect.js"></script>
  <script src="phone-gallery.js"></script>
</body>
</html>
