<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Come here, Aaru… ♡</title>
  <link rel="stylesheet" href="bedroom.css">
</head>
<body>
  <main class="bedroom-page">
    <div class="bedroom-stage">
      <img
        src="assets/pixel-bedroom.png"
        alt="A cozy romantic bedroom with a green bed and moonlit window"
        class="bedroom-image"
      >
      <button class="bed-hotspot" id="bedHotspot" aria-label="Sit together on the bed"></button>
    </div>

    <a class="bedroom-back" href="index.html" aria-label="Back to our room">←</a>
  </main>

  <section class="bed-interaction" id="bedInteraction" aria-hidden="true">
    <div class="bed-interaction-backdrop" id="bedInteractionBackdrop"></div>

    <div class="chibi-stage" id="chibiStage">
      <img id="chibiImageA" class="chibi-composite is-visible" src="assets/bed-chibis/initial image.png" alt="Aaru and Somo">
      <img id="chibiImageB" class="chibi-composite" src="assets/bed-chibis/initial image.png" alt="">

      <button class="character-hotspot aaru-hotspot" id="aaruHotspot" type="button" aria-label="Talk to Aaru"></button>
      <button class="character-hotspot somo-hotspot" id="somoHotspot" type="button" aria-label="Talk to Somo"></button>

      <div class="speech-bubble speech-bubble-aaru" id="aaruSpeech" aria-live="polite" aria-hidden="true"></div>
      <div class="speech-bubble speech-bubble-somo" id="somoSpeech" aria-live="polite" aria-hidden="true"></div>
    </div>

    <div class="bed-dialogue" role="dialog" aria-modal="true" aria-labelledby="bedDialogueTitle">
      <button class="dialogue-close" id="dialogueClose" aria-label="Close">×</button>
      <div class="dialogue-name" id="bedDialogueName">Aaru & Somo</div>
      <h2 id="bedDialogueTitle">A quiet little moment, just for us. ♡</h2>
      <p id="bedDialogueText">Come sit with me for a while.</p>

      <div class="bed-actions" id="bedActions"></div>
    </div>
  </section>

  <script src="bedroom.js"></script>
</body>
</html>
