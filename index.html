<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little World — Made for RT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="pixel-world">

    <!-- Vertical pixel-art room -->
    <div class="pixel-room"></div>
    <div class="room-shade"></div>

    <!-- Small top title -->
    <div class="intro">
      <p>A LITTLE WORLD...</p>
      <h1>Made for RT <span>♥</span></h1>
      <div class="intro-line"></div>
      <small>A small corner of the internet,<br>made with a lot of love.</small>
    </div>

    <!-- Interactive objects -->

    <!-- Window = Bucket List -->
    <button class="hotspot hotspot-window"
      data-section="bucketlist"
      aria-label="Our Bucket List">
      <span class="hotspot-label">🌿 Bucket List</span>
    </button>

    <!-- Photo frame = Our Photos -->
    <button class="hotspot hotspot-photo"
      data-section="photos"
      aria-label="Our Photos">
      <span class="hotspot-label">🖼️ Our Photos</span>
    </button>

    <!-- Flowers = Date of Dates -->
    <button class="hotspot hotspot-flowers"
      data-section="dates"
      aria-label="Date of Dates">
      <span class="hotspot-label">🌸 Date of Dates</span>
    </button>

    <!-- Book = Our Story -->
    <button class="hotspot hotspot-book"
      data-section="story"
      aria-label="Our Story">
      <span class="hotspot-label">📖 Our Story</span>
    </button>

    <!-- Letter = Things I Love About You -->
    <button class="hotspot hotspot-letter"
      data-section="love"
      aria-label="Things I Love About You">
      <span class="hotspot-label">💌 Things I Love About You</span>
    </button>

    <!-- Cat = Secret love message -->
    <button class="hotspot hotspot-cat"
      id="catButton"
      aria-label="A little surprise">
      <span class="hotspot-label">♡</span>
    </button>

    <!-- Cat message -->
    <div class="cat-message" id="catMessage">
      <button class="message-close" id="messageClose">×</button>
      <div class="big-heart">♥</div>
      <h2>I love u RT Baby</h2>
      <p>♡</p>
    </div>

    <!-- Section modal -->
    <div class="section-modal" id="sectionModal" aria-hidden="true">
      <div class="modal-card">
        <button class="close-modal" id="closeModal">×</button>

        <p class="modal-kicker">A LITTLE CHAPTER</p>
        <h2 id="modalTitle">Our Story</h2>
        <p id="modalText"></p>

        <button class="back-button" id="modalBack">
          Back to our room ♡
        </button>
      </div>
    </div>

    <div class="bottom-note">
      <span>— ♥ —</span>
      <p>Hover over the little things.<br>Some of them have stories.</p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
