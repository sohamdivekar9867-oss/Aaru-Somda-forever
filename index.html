<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little World — Made for Aaru</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <header class="intro">
      <div class="eyebrow">A LITTLE WORLD... <span>♥</span></div>

      <h1>Made for Aaru <span class="outline-heart">♡</span></h1>

      <p>A little room filled with<br>pieces of us.</p>
    </header>


    <!-- THE ROOM -->

    <section class="room-wrapper">

      <div class="room-scene" aria-label="Our little pixel room">

        <img
          src="assets/pixel-room.png"
          alt="A cozy pixel-art room with a window, desk, flowers, books, photographs and a cat"
          class="room-image"
        />

        <!-- WINDOW -->
        <button
          class="hotspot window-hotspot"
          data-title="Our Bucket List"
          data-content="All the places we want to go, all the little things we want to do, and all the memories still waiting for us."
          aria-label="Our Bucket List"
        ></button>

        <!-- BOOK - OPENS OUR STORY PAGE -->
        <button
          class="hotspot book-hotspot"
          data-title="Our Story"
          data-link="our-story.html"
          aria-label="Open Our Story"
        ></button>

        <!-- LETTER -->
        <button
          class="hotspot letter-hotspot"
          data-title="Things I Love About You"
          data-content="The little things, the big things, and all the things I probably don't say enough."
          aria-label="Things I Love About You"
        ></button>

        <!-- FLOWERS -->
        <button
          class="hotspot flowers-hotspot"
          data-title="Date of Dates"
          data-content="A place for our favourite dates, our sweetest memories, and all the dates we haven't had yet."
          aria-label="Date of Dates"
        ></button>

        <!-- PHOTO FRAMES -->
        <button
          class="hotspot photos-hotspot"
          data-title="Our Photos"
          data-content="Little pieces of time I want to keep forever. More memories will find their place here."
          aria-label="Our Photos"
        ></button>

        <!-- CAT -->
        <button
          class="hotspot cat-hotspot"
          data-title="I love u Aaru Baby ♡"
          data-content="Just a tiny reminder from your sleepy little guardian."
          aria-label="I love u Aaru Baby"
        ></button>

      </div>

    </section>


    <footer class="footer">
      <div class="footer-heart">— ♥ —</div>
      <p>Hover over the little things.<br>Some of them have stories.</p>
    </footer>

  </main>


  <!-- POPUP FOR OTHER OBJECTS -->

  <div class="modal" id="memoryModal" aria-hidden="true">

    <div class="modal-backdrop"></div>

    <div class="modal-card" role="dialog" aria-modal="true">

      <button class="modal-close" aria-label="Close">×</button>

      <div class="modal-small">A LITTLE PIECE OF US</div>

      <h2 id="modalTitle"></h2>

      <div class="modal-divider">♥</div>

      <p id="modalContent"></p>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
