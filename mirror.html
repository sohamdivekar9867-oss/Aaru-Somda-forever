<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Mirror · Aaru & Somo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #12090b;
    }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mirror-page {
      position: relative;
      width: 100%;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #12090b;
    }
    .mirror-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .back-button {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 20;
      border: 1px solid rgba(255, 235, 220, .35);
      background: rgba(30, 12, 14, .72);
      color: #fff1e8;
      border-radius: 999px;
      padding: 9px 14px;
      font: 500 12px/1 "DM Mono", monospace;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .back-button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main class="mirror-page">
    <button class="back-button" onclick="history.back()">← Back</button>
    <img
      class="mirror-art"
      src="assets/Mirror.png"
      alt="Our cozy bedroom reflected in the mirror"
    />
  </main>
</body>
</html>
