<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Mirror · Aaru & Somo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #12090b;
    }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mirror-page {
      position: relative;
      width: 100%;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #12090b;
      overflow: hidden;
    }
    .mirror-stage {
      position: relative;
      width: min(100vw, 66.6667svh);
      height: min(150vw, 100svh);
      aspect-ratio: 2 / 3;
      flex: 0 0 auto;
    }
    .mirror-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
    }
    /*
      These are character-only transparent PNGs. They sit above the reflection
      so the room/bed remains supplied by Mirror.png itself.
    */
    .mirror-character {
      position: absolute;
      display: block;
      height: auto;
      width: auto;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }
    .mirror-aaru {
      left: 12.5%;
      top: 27%;
      width: 42%;
    }
    .mirror-somo {
      left: 54%;
      top: 27%;
      width: 28%;
    }
    .back-button {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 20;
      border: 1px solid rgba(255, 235, 220, .35);
      background: rgba(30, 12, 14, .72);
      color: #fff1e8;
      border-radius: 999px;
      padding: 9px 14px;
      font: 500 12px/1 "DM Mono", monospace;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .back-button:active { transform: scale(.97); }

    @media (max-width: 520px) {
      .mirror-aaru {
        left: 12%;
        top: 27%;
        width: 44%;
      }
      .mirror-somo {
        left: 53%;
        top: 27%;
        width: 29%;
      }
    }
  </style>
</head>
<body>
  <main class="mirror-page">
    <button class="back-button" onclick="history.back()">← Back</button>

    <div class="mirror-stage" aria-label="Aaru and Somo in the mirror">
      <img
        class="mirror-art"
        src="assets/Mirror.png"
        alt="Our cozy bedroom reflected in the mirror"
      />

      <img
        class="mirror-character mirror-aaru"
        src="assets/mirror-scene/mirror-aaru.png"
        alt="Aaru standing in front of the mirror"
        draggable="false"
      />

      <img
        class="mirror-character mirror-somo"
        src="assets/mirror-scene/mirror-somo.png"
        alt="Somo sitting on the bed and looking at Aaru"
        draggable="false"
      />
    </div>
  </main>
</body>
</html>
